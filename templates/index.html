<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFW Web Manager 1.1</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<header>
  <div><h1>UFW Web Manager <small>1.1</small></h1><p>Ubuntu Server 防火墙管理</p></div>
  <div class="buttons"><button onclick="reloadAll()">刷新</button><button onclick="doAction('/api/reload')">重载</button></div>
</header>

<section class="grid">
<div class="card">
<h2>状态</h2><pre id="status">加载中...</pre>
<div class="buttons"><button class="primary" onclick="enableUfw()">启用 UFW</button><button class="danger" onclick="disableUfw()">禁用 UFW</button></div>
</div>
<div class="card">
<h2>默认策略</h2>
<div class="formgrid">
<label>入站<select id="incoming"><option>allow</option><option selected>deny</option><option>reject</option></select></label>
<label>出站<select id="outgoing"><option selected>allow</option><option>deny</option><option>reject</option></select></label>
<label>转发<select id="routed"><option>allow</option><option selected>deny</option><option>reject</option></select></label>
</div>
<button onclick="savePolicies()">应用默认策略</button>
</div>
</section>

<section class="card">
<h2>添加规则</h2>
<div class="formgrid">
<label>动作<select id="action"><option value="allow">允许</option><option value="deny">拒绝</option><option value="reject">Reject</option><option value="limit">Limit</option></select></label>
<label>方向<select id="direction"><option value="">任意</option><option value="in">入站</option><option value="out">出站</option></select></label>
<label>端口<input id="port" placeholder="22 / 80,443 / 8000:9000"></label>
<label>协议<select id="protocol"><option value="">任意</option><option>tcp</option><option>udp</option></select></label>
<label>来源<input id="from" value="any" placeholder="any / 192.168.1.0/24"></label>
<label>目标<input id="to" value="any" placeholder="any / 10.0.0.1"></label>
<label class="wide">备注<input id="comment" maxlength="100" placeholder="可选"></label>
</div>
<button class="primary" onclick="addRule()">添加规则</button>
</section>

<section class="card">
<div class="head"><h2>当前规则</h2><button onclick="loadRules()">刷新</button></div>
<pre id="rules">加载中...</pre>
</section>

<section class="card">
<h2>删除规则</h2>
<div class="buttons"><input id="ruleNumber" type="number" min="1" placeholder="规则编号"><button class="danger" onclick="deleteRule()">删除</button></div>
<p class="hint">删除前请确认 numbered rule 编号。删除后 UFW 会重新编号。</p>
</section>
<div id="toast"></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
